name: Deploy CESGS Baruna

# Snapshot statis: data sudah di-commit di frontend/data/output, jadi tinggal deploy.
# (Dulu regenerate data tiap hari lewat backend.pipeline.run; dimatikan biar data snapshot tidak ketimpa.)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deploy
        uses: actions/deploy-pages@v4
